[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-dast"
version = "0.1.0"
description = "Multi-agent AI DAST orchestration core"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "mitmproxy==12.2.3",
  "playwright>=1.55,<2",
  "pydantic>=2.12,<3",
]

[project.scripts]
aidast = "aidast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"aidast.skills.scope" = ["SKILL.md"]
